<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Date, Time & Weather</title>
    
    <!-- LINK TO YOUR EXISTING CSS FILE HERE -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ensure these IDs match what your style.css targets -->
    <div class="container">
        <div id="date">Loading date...</div>
        <div id="time">Loading time...</div>
        <div class="info-row">
        	<div id="temp">Loading temp...</div>
        	<div id="weather">Loading weather...</div>
    	</div>
    	<div id="logo">
    		<img src="./assets/kyler.jpg" alt="Happy Kyler gets his Lubys" class="logo-img">
    	</div>
    </div>

    <script>
        // 1. Update Date and Time
        function updateTime() {
            const now = new Date();

            // format date: "Wednesday 22/07/2026"
            const dateOptions = {
            	weekday: 'long',
            	day: '2-digit',
            	month: '2-digit',
            	year: 'numeric'
            };

            // format time: "10:30:45 AM"
            const timeOptions = {
            	hour: '2-digit',
            	minute: '2-digit',
            	second: '2-digit'
            };

            const dateString = now.toLocaleDateString(undefined, dateOptions);
            const timeString = now.toLocaleTimeString(undefined, timeOptions);

            document.getElementById('date').textContent = dateString;
            document.getElementById('time').textContent = timeString;

        }

        setInterval(updateTime, 1000);
        updateTime();

        // 2. Fetch Weather
        async function getWeather(lat, lon) {
            const apiKey = '49cf34d6340c72d6d00750b859b719be';
            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=imperial`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Weather data not found');
                const data = await response.json();
                
                const condition = data.weather[0].description;
                const temp = Math.round(data.main.temp);
                const city = data.name;
                
                // Updates the elements with IDs 'temp' & 'weather'
                document.getElementById('temp').textContent = `${temp}°F`;
                document.getElementById('weather').innerHTML = 
                    `<strong>${city}</strong>: ${condition}`;
            } catch (error) {
                document.getElementById('weather').textContent = 'Unable to fetch weather.';
                console.error(error);
            }
        }
 
        // 3. Get User Location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    getWeather(position.coords.latitude, position.coords.longitude);
                },
                () => {
                    document.getElementById('weather').textContent = 'Location access denied.';
                }
            );
        } else {
            document.getElementById('weather').textContent = 'Geolocation not supported.';
        }
    </script>
</body>
</html>
